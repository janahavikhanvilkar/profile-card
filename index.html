<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="theme-buttons">
    <button class="btn-theme light-btn" onclick="setLight()">☀️ Light</button>
    <button class="btn-theme dark-btn" onclick="setDark()">🌙 Dark</button>
  </div>

 
  <div class="card">
    <div class="card-content">
      
      
      <div class="avatar-wrapper">
        <img src="dark.jpg" alt="Dark Profile Avatar" class="avatar dark-img">
        <img src="light.jpg" alt="Light Profile Avatar" class="avatar light-img">
      </div>

     
      <h1 class="name">Kate Winslet</h1>

      
      <p class="bio">
         Frontend developer focused on building fast, accessible, and thoughtfully designed web interfaces. Currently deepening my full-stack skills with the <a href="https://www.mongodb.com/mern-stack" target="_blank">MERN stack</a> while exploring interactive design and motion.
      </p>

      
      <a href="mailto:lexa.smith@example.com" class="btn-contact">
        <img src="icons\icons\email.svg" alt="Email icon" class="contact-icon">
        <span>Get in touch</span>
      </a>

    </div>

  
    <div class="card-footer">
      <div class="social-links">
        <a href="https://tiktok.com" target="_blank" class="social-icon">
          <img src="icons\icons\tiktok.svg" alt="TikTok">
        </a>
        <a href="https://instagram.com" target="_blank" class="social-icon">
          <img src="icons\icons\instagram.svg" alt="Instagram">
        </a>
        <a href="https://twitter.com" target="_blank" class="social-icon">
          <img src="icons\icons\twitter.svg" alt="Twitter">
        </a>
        <a href="https://example.com" target="_blank" class="social-icon">
          <img src="icons\icons\website.svg" alt="Website">
        </a>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
